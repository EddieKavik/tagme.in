<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter Bar Test</title>
  <link rel="stylesheet" href="search.css" />
  <link rel="stylesheet" href="filterbar.css" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    
    .test-messages {
      margin: 20px 0;
    }
    
    .text-message {
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #333;
      border-radius: 4px;
    }
    
    .compose {
      padding: 10px;
      border: 1px solid #333;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    
    textarea {
      width: 100%;
      padding: 8px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Filter Bar Test</h1>
  
  <div class="compose">
    <textarea placeholder="Write a message (up to 175 characters)"></textarea>
  </div>
  
  <div class="test-messages">
    <div class="text-message">
      <p>This is a test message with #javascript and #webdev tags</p>
    </div>
    
    <div class="text-message">
      <p>Another message with #javascript and #react tags</p>
    </div>
    
    <div class="text-message">
      <p>This message has #python and #backend tags</p>
    </div>
    
    <div class="text-message">
      <p>A message with #frontend and #css tags</p>
    </div>
    
    <div class="text-message">
      <p>This message has no tags</p>
    </div>
    
    <div class="text-message">
      <p>Message with #javascript, #react, and #frontend tags</p>
    </div>
  </div>
  
  <script src="./js/search.js"></script>
  <script src="./js/filterbar.js"></script>
  
  <script>
    // Test the functionality
    setTimeout(() => {
      console.log('Testing filter bar functionality...')
      
      // Check if filter bar was created
      const filterBar = document.querySelector('.filter-bar')
      if (filterBar) {
        console.log('✅ Filter bar created successfully')
      } else {
        console.log('❌ Filter bar not found')
      }
      
      // Check if tags were extracted
      const tagButtons = document.querySelectorAll('.tag-button')
      console.log('Found', tagButtons.length, 'tag buttons')
      
      // Test tag filtering
      if (tagButtons.length > 0) {
        console.log('Testing tag filtering...')
        const firstTagButton = tagButtons[0]
        firstTagButton.click()
        
        setTimeout(() => {
          const visibleMessages = document.querySelectorAll('.text-message:not(.tag-hidden)')
          console.log('After filtering,', visibleMessages.length, 'messages are visible')
        }, 100)
      }
    }, 2000)
  </script>
</body>
</html>
